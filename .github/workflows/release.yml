# LooperCat release — cut on pushing a clean vX.Y.Z tag. Two build lanes feed
# one draft: the family's self-hosted mac signs + notarizes + staples a DMG
# (the Developer ID keychain and the notary profile live there — the orbitcab
# pattern), windows-latest builds the portable zip (unsigned until the code
# signing certificate story lands — the guide says so), and a publish job
# collects both under one SHA256SUMS into a DRAFT GitHub Release: publishing
# is a human decision, the pipeline only prepares it.
#
# Required on this repo: secret MACOS_APP_IDENTITY (the codesign identity
# name), secret KCH_PWD (the runner keychain password), var NOTARY_PROFILE
# (the notarytool keychain profile). The release is created with the built-in
# GITHUB_TOKEN.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only CLEAN vX.Y.Z tags may publish: the in-app update check treats
      # every published release as authoritative and parses semver out of the
      # tag, so a suffixed tag must never become the /releases/latest answer.
      - name: Gate — the tag must be clean semver (vX.Y.Z)
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a clean vX.Y.Z release tag — refusing to publish."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Gate — the tag must match the CMake project version
        run: |
          CMAKE_VER="$(sed -nE 's/^project\(LooperCat VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          if [ "v${CMAKE_VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::CMakeLists.txt says ${CMAKE_VER} but the tag is ${GITHUB_REF_NAME} — bump the project version first."
            exit 1
          fi

  macos:
    needs: gate
    # Pinned to the STUDIO runner while it is the only build Mac with the
    # dcat-signing keychain; drop the `studio` label once M5 is equipped too.
    runs-on: [self-hosted, macOS, studio]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Configure (Release; universal — the CMake default arches)
        # LOOPERCAT_BUILDER stamps the version-badge flavor: a shipped build
        # says "release", never the default "dev" of a workstation build.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOOPERCAT_BUILDER=release

      - name: Build
        run: cmake --build build -j

      - name: Test (all suites)
        run: ctest --test-dir build --output-on-failure

      - name: Sign, package, notarize, staple
        env:
          APP_ID:  ${{ secrets.MACOS_APP_IDENTITY }}
          NOTARY:  ${{ vars.NOTARY_PROFILE }}
          KCH_PWD: ${{ secrets.KCH_PWD }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          APP="$(find build -type d -name 'LooperCat.app' -path '*LooperCat_artefacts*' | head -1)"
          [ -n "$APP" ] || { echo "::error::LooperCat.app not found under build/"; exit 1; }

          # The suite's dedicated signing keychain (holds only the Developer ID
          # identities; same password on every build Mac = the org KCH_PWD).
          # Unlock + partition-list so codesign works without a GUI prompt —
          # without this a self-hosted run dies with errSecInternalComponent.
          KEYCHAIN="$HOME/Library/Keychains/dcat-signing.keychain-db"
          [ -f "$KEYCHAIN" ] || { echo "::error::no dcat-signing keychain on this runner — run setup-dcat-signing.sh here first"; exit 1; }
          security unlock-keychain -p "$KCH_PWD" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCH_PWD" "$KEYCHAIN" >/dev/null
          # The job session carries its own keychain view: pin the search list
          # and make the signing keychain the default while codesign runs —
          # the interactive session signs fine without this, the runner job
          # dies with errSecInternalComponent (seen on the v0.9.0 attempts).
          security list-keychains -d user -s login.keychain-db "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Diagnostics for the log — what this job actually sees:
          security list-keychains
          security default-keychain
          security find-identity -v -p codesigning "$KEYCHAIN"

          # The app: hardened runtime, no extra entitlements — playback-only
          # (no capture, no mic; the pedal is a USB volume, not an input).
          codesign --keychain "$KEYCHAIN" --force --options runtime --timestamp --sign "$APP_ID" "$APP"
          codesign --verify --strict --verbose=1 "$APP"

          # A plain honest DMG: the app and an Applications shortcut.
          mkdir -p dist/stage
          cp -R "$APP" dist/stage/
          ln -s /Applications dist/stage/Applications
          DMG="dist/LooperCat-${VER}-macOS.dmg"
          hdiutil create -volname "LooperCat ${VER}" -srcfolder dist/stage -ov -format UDZO "$DMG"
          codesign --keychain "$KEYCHAIN" --force --timestamp --sign "$APP_ID" "$DMG"

          # The notary profile lives in the login keychain (where
          # store-credentials wrote it) — restore the default before notarytool.
          security default-keychain -s login.keychain-db

          # Notarizing the DMG covers the nested app; stapling the DMG makes
          # it install offline. The app itself validates its ticket online on
          # first run — the standard DMG story.
          xcrun notarytool submit "$DMG" --keychain-profile "$NOTARY" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Hand the DMG to the publish job
        uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: dist/LooperCat-*-macOS.dmg
          if-no-files-found: error

  windows:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Configure (Release flavor badge)
        run: cmake -B build -DLOOPERCAT_BUILDER=release

      - name: Build
        run: cmake --build build --config Release

      - name: Test (all suites)
        run: ctest --test-dir build -C Release --output-on-failure

      # The exe must run on a machine with no VC++ redistributable: a
      # dynamic-CRT import in the exe means the static-runtime setting
      # regressed and a clean user machine would refuse to start it.
      - name: Assert static CRT (no VCRUNTIME import)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/LooperCat_artefacts/Release/LooperCat.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCRUNTIME140") { throw "dynamic CRT leaked into the exe" }
          Write-Output "static CRT confirmed"

      - name: Package the portable zip
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "build/LooperCat_artefacts/Release/LooperCat.exe" `
                           -DestinationPath "dist/LooperCat-$ver-Windows.zip"

      - name: Hand the zip to the publish job
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: dist/LooperCat-*-Windows.zip
          if-no-files-found: error

  linux:
    needs: gate
    # 22.04 ON PURPOSE, and it is the difference between shipping to Linux and
    # shipping to this year's Linux. An AppImage inherits the glibc of the
    # machine that built it, and since glibc 2.38 the headers redirect plain
    # strtol/sscanf to __isoc23_* symbols — so a binary built on 24.04 demands
    # GLIBC_2.38 and refuses to start on Ubuntu 22.04 (2.35), Debian 12 (2.36)
    # or Mint 21, with an error naming a symbol rather than a cause. The same
    # source on 22.04 asks for 2.34. Ubuntu 22.04 is supported into 2027, so
    # that is a large share of players. Raise this floor only with a reason.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # gcc-12: 22.04 ships gcc-11 by default, which is short of the C++20 the
      # core needs. The older glibc is the point; the older compiler is not.
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 ninja-build pkg-config libudev-dev \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libgl1-mesa-dev

      - name: Configure (Release flavor badge)
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOOPERCAT_BUILDER=release

      - name: Build
        run: cmake --build build -j4

      - name: Test (all suites)
        run: ctest --test-dir build --output-on-failure

      # Without the udev backend the app has no device truth at all, and it
      # fails silently — the monitor thread simply never starts.
      - name: Assert the udev backend is linked in
        run: |
          ldd build/LooperCat_artefacts/Release/LooperCat | grep -q libudev.so \
            || { echo "libudev is not linked"; exit 1; }
          echo "udev backend confirmed"

      # The glibc floor is a shipping decision, not a build detail: every
      # version above 2.35 excludes a distribution that is still supported,
      # and the exclusion shows up as a symbol-not-found error on a user's
      # machine rather than anywhere near this build. Assert it so a runner
      # image bump cannot move it quietly.
      - name: Assert the glibc floor (<= 2.35, Ubuntu 22.04)
        run: |
          HIGHEST=$(objdump -T build/LooperCat_artefacts/Release/LooperCat \
                    | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest required: $HIGHEST"
          case "$HIGHEST" in
            GLIBC_2.3|GLIBC_2.[0-9]|GLIBC_2.1?|GLIBC_2.2?|GLIBC_2.3[0-5]) ;;
            *) echo "glibc floor rose to $HIGHEST — this build excludes Ubuntu 22.04"; exit 1 ;;
          esac

      - name: Package the AppImage
        run: |
          VER="${GITHUB_REF_NAME#v}"
          packaging/linux/make-appimage.sh build "$VER" dist

      # An AppImage that cannot start is worth nothing, and the failure mode
      # is a missing bundled library, which only shows on a machine that is
      # not the build machine. The headless snapshot seam runs the real app
      # through its real startup path.
      - name: Prove the AppImage runs
        run: |
          sudo apt-get install -y xvfb
          chmod +x dist/LooperCat-*.AppImage
          mkdir -p /tmp/probe/ROLAND/DATA /tmp/probe/ROLAND/WAVE
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            dist/LooperCat-*.AppImage --volume /tmp/probe --snapshot /tmp/probe.png
          test -s /tmp/probe.png && echo "the AppImage starts and renders"

      - name: Hand the AppImage to the publish job
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/LooperCat-*.AppImage
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect both lanes
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS across every asset — the mac story had per-file sums
      # in the same file; two lanes just mean two lines.
      - name: Checksums
        run: |
          cd dist
          sha256sum LooperCat-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "LooperCat ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/LooperCat-* dist/SHA256SUMS
