# The Windows lanes behind the port (issue #5). The core is OS-free by
# design (header-only C++20, std::filesystem); core-windows keeps it that
# way with MSVC on every push. app-windows builds the full JUCE app with the
# phase-0 DeviceWatcher backend and publishes the unsigned dev artifact —
# the proof the app tier compiles and links on Windows long before signing
# and hardware QA. The macOS story is covered by the release lane and local
# development.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure (core only, no JUCE)
        run: cmake -B build -DLOOPERCAT_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test (all core suites)
        run: ctest --test-dir build -C Release --output-on-failure

  app-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Configure (app, no test tier)
        run: cmake -B build -DLOOPERCAT_BUILD_TESTS=OFF

      - name: Build the app
        run: cmake --build build --config Release --target LooperCat

      # The exe must run on a machine with no VC++ redistributable: a
      # dynamic-CRT import in the exe means the static-runtime setting
      # regressed and a clean user machine would refuse to start it.
      - name: Assert static CRT (no VCRUNTIME import)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/LooperCat_artefacts/Release/LooperCat.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCRUNTIME140") { throw "dynamic CRT leaked into the exe" }
          Write-Output "static CRT confirmed"

      - name: Upload the unsigned dev artifact
        uses: actions/upload-artifact@v6
        with:
          name: LooperCat-windows-dev-unsigned
          path: build/LooperCat_artefacts/Release/
          if-no-files-found: error
